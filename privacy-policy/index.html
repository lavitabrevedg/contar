<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contar privacy policy language selection">
  <title>Contar Privacy Policy</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #10111a; color: #f4f1ff; }
    body { margin: 0; line-height: 1.75; }
    main { box-sizing: border-box; max-width: 880px; margin: 0 auto; padding: 48px 24px 72px; }
    h1, h2 { color: #fff; line-height: 1.3; }
    h1 { margin: 0 0 8px; font-size: clamp(2rem, 6vw, 3rem); }
    h2 { margin-top: 44px; font-size: 1.38rem; }
    a { color: #c9b6ff; }
    table { width: 100%; border-collapse: collapse; margin: 16px 0; border: 1px solid #403563; }
    th, td { padding: 13px; border: 1px solid #403563; text-align: left; vertical-align: top; }
    th, .notice { background: #1b1728; }
    .updated, footer { color: #c8c6d2; }
    .notice { margin: 24px 0; padding: 18px 20px; border: 1px solid #403563; border-radius: 14px; }
    hr { margin: 60px 0; border: 0; border-top: 1px solid #393344; }
    footer { margin-top: 48px; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Contar Privacy Policy</h1>
    <p class="updated">Choose the language for this policy.</p>
    <div class="notice">
      <p><a href="ko.html">한국어 개인정보처리방침</a></p>
      <p><a href="en.html">English Privacy Policy</a></p>
    </div>
    <footer>© 2026 PeachTreeStudio. All rights reserved.</footer>
  </main>
  <script>
    const target = navigator.language.toLowerCase().startsWith("ko") ? "ko.html" : "en.html";
    window.location.replace(target);
  </script>
</body>
</html>
